# ============================================================
# mini-sync-server（Spring Boot 常驻服务）配置
#
# 所有敏感信息从环境变量读取，代码里不落口令。
# 环境变量来自项目根目录的 .env（由启动脚本加载）。
# ============================================================

spring.application.name=mini-sync-server

# 开发期用 8081，与 Node 控制台(8090)并存，便于逐步迁移与回退。
# 迁移完成后把这里改成 8090 并停掉 Node，前端无需改动。
server.port=${MINISYNC_SERVER_PORT:8081}

# ---------------- 管理库（MySQL）----------------
# 注意：库名是 mini_sync_admin，不是 mini_sync
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MINISYNC_ADMIN_HOST:127.0.0.1}:${MINISYNC_ADMIN_PORT:3306}/${MINISYNC_ADMIN_DB:mini_sync_admin}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${MINISYNC_DB_USER:root}
spring.datasource.password=${MINISYNC_DB_PWD}

# ---------------- MyBatis-Plus ----------------
# 下划线列名 -> 驼峰属性名（job_name -> jobName）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 开发期打印执行的 SQL，便于核对；上线可改成 NoLoggingImpl
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 主键自增
mybatis-plus.global-config.db-config.id-type=auto

# ---------------- 日志 ----------------
logging.level.root=INFO
logging.level.com.minisync=INFO
